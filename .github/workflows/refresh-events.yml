name: Refresh official coffee events

on:
  push:
    paths:
      - 'event_scraper.py'
      - 'requirements.txt'
      - '.github/workflows/refresh-events.yml'
  schedule:
    - cron: '15 0 * * *' # daily around 09:15 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-events
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Get latest files
        run: git pull --ff-only origin main
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Read official public event pages
        run: python event_scraper.py
      - name: Save changed event list
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/events.csv data/menus.csv images
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh official coffee events'
            git pull --rebase origin main
            git push
          fi
